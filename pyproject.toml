[project]
name = "kwhale-agent"
version = "0.1.0"
description = "KWhale agent layer: standalone playlist parsers, kwhale API bridge, MCP server"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
fallback = ["yt-dlp>=2024.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
kwhale-agent-mcp = "kwhale_agent.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kwhale_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
